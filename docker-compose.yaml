services:
  pulsecheck:
    container_name: pulsecheck
    image: pulsecheck:latest
    build:
      context: .
      dockerfile_inline: |
        FROM debian:bookworm-slim

        # Prevent interactive prompts during package installation
        ENV DEBIAN_FRONTEND=noninteractive \
            PYTHONUNBUFFERED=1 \
            PULSECHECK_IP=0.0.0.0 \
            PULSECHECK_HOSTNAME=127.0.0.1 \
            PULSECHECK_SSL=FALSE \
            PULSECHECK_PORT=8182 \
            PULSECHECK_HEADLESS=1 \
            PULSECHECK_DB_PATH=/app/data/pulsecheck.db

        # Install system dependencies: Python, pip, venv, curl, ca-certificates, tar, tzdata, and iproute2
        RUN apt-get update && apt-get install -y --no-install-recommends \
            python3 \
            python3-pip \
            python3-venv \
            curl \
            ca-certificates \
            tar \
            tzdata \
            iproute2 \
            net-tools \
            iputils-ping \
         && rm -rf /var/lib/apt/lists/*

        WORKDIR /app

        # Pull code from GitHub and unpack directly into /app
        ARG REPO_URL=https://github.com/diepeterpan/pulsecheck/archive/refs/heads/main.tar.gz
        RUN curl -fsSL "$$REPO_URL" -o /tmp/pulsecheck.tar.gz \
         && tar -xzf /tmp/pulsecheck.tar.gz --strip-components=1 -C /app \
         && rm -f /tmp/pulsecheck.tar.gz

        # Set up Python virtual environment and install requirements
        RUN python3 -m venv /app/.venv \
         && /app/.venv/bin/pip install --no-cache-dir -r requirements.txt

        # Create persistent data directory for SQLite database
        RUN mkdir -p /app/data

        EXPOSE 8182

        # Start PulseCheck application using Gunicorn with gevent WSGI worker
        CMD ["/app/.venv/bin/gunicorn", "--bind", "0.0.0.0:8182", "--workers", "1", "--worker-class", "gevent", "--worker-connections", "1000", "--timeout", "120", "--no-control-socket", "app:app"]
    ports:
      - "8182:8182"
    environment:
      - PULSECHECK_IP=${PULSECHECK_IP:-0.0.0.0}
      - PULSECHECK_HOSTNAME=${PULSECHECK_HOSTNAME:-127.0.0.1}
      - PULSECHECK_SSL=${PULSECHECK_SSL:-FALSE}
      - PULSECHECK_PORT=8182
      - PULSECHECK_HEADLESS=1
      - PULSECHECK_DB_PATH=/app/data/pulsecheck.db
      - PULSECHECK_SCAN_WORKERS=${PULSECHECK_SCAN_WORKERS:-5}
      - PULSECHECK_SCAN_RETRIES=${PULSECHECK_SCAN_RETRIES:-3}
      - PULSECHECK_SCAN_RETRY_INTERVAL=${PULSECHECK_SCAN_RETRY_INTERVAL:-10}
      - PULSECHECK_EXPLICIT_DEBUG=${PULSECHECK_EXPLICIT_DEBUG:-false}
      - TZ=${TZ:-}
      - PULSECHECK_TIMEZONE=${PULSECHECK_TIMEZONE:-${TZ:-}}
      - PULSECHECK_OIDC_ENABLED=${PULSECHECK_OIDC_ENABLED:-false}
      - PULSECHECK_OIDC_ISSUER=${PULSECHECK_OIDC_ISSUER:-}
      - PULSECHECK_OIDC_CLIENT_ID=${PULSECHECK_OIDC_CLIENT_ID:-}
      - PULSECHECK_OIDC_CLIENT_SECRET=${PULSECHECK_OIDC_CLIENT_SECRET:-}
      - PULSECHECK_OIDC_REDIRECT_URI=${PULSECHECK_OIDC_REDIRECT_URI:-}
      - PULSECHECK_OIDC_SCOPES=${PULSECHECK_OIDC_SCOPES:-openid email profile}
      - PULSECHECK_OIDC_MATCH_CLAIM=${PULSECHECK_OIDC_MATCH_CLAIM:-email}
      - PULSECHECK_OIDC_INITIAL_ADMIN=${PULSECHECK_OIDC_INITIAL_ADMIN:-}
      - PULSECHECK_OIDC_SSL_VERIFY=${PULSECHECK_OIDC_SSL_VERIFY:-true}
      - PULSECHECK_SECRET_KEY=${PULSECHECK_SECRET_KEY:-pulsecheck-local-dev}
    volumes:
      - pulsecheck-data:/app/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

volumes:
  pulsecheck-data:
