{% extends 'base.html' %}
{% block content %}
  <section class="panel">
    <div class="panel-header">
      <h2>Edit Domain</h2>
      <a class="button secondary" href="{{ return_to or url_for('domains') }}">Back to list</a>
    </div>
    <form method="post">
      <input type="hidden" name="return_to" value="{{ return_to }}">

      <label for="name">Domain name</label>
      <input type="text" id="name" name="name" value="{{ domain.name }}" required>

      <label for="match">Match</label>
      <input type="text" id="match" name="match" value="{{ domain.match }}" required>

      <label for="url_path">URL path (optional)</label>
      <input type="text" id="url_path" name="url_path" value="{{ domain.url_path }}" placeholder="/test/test.asp">

      <label for="comment">Comment (optional)</label>
      <input type="text" id="comment" name="comment" value="{{ domain.comment or '' }}" placeholder="Notes, purpose, or owner">

      <label for="paused">
        <input type="checkbox" id="paused" name="paused" {% if domain.paused %}checked{% endif %}>
        Paused
      </label>

      <label for="ports">Ports</label>
      <input type="text" id="ports" name="ports" value="{{ domain.ports | join(', ') }}" placeholder="80, 443, 8443">

      <div style="display: flex; gap: 12px; margin-top: 10px;">
        <button type="submit" class="button primary">Save</button>
        <a href="{{ return_to or url_for('domains') }}" class="button secondary" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border-radius: 8px;">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
