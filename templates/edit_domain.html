{% extends 'base.html' %}
{% block content %}
  <section class="panel">
    <h2>Edit Domain</h2>
    <form method="post">
      <label for="name">Domain name</label>
      <input type="text" id="name" name="name" value="{{ domain.name }}" required>

      <label for="match">Match</label>
      <input type="text" id="match" name="match" value="{{ domain.match }}" required>

      <label for="url_path">URL path (optional)</label>
      <input type="text" id="url_path" name="url_path" value="{{ domain.url_path }}" placeholder="/test/test.asp">

      <label for="ports">Ports</label>
      <input type="text" id="ports" name="ports" value="{{ domain.ports | join(', ') }}" placeholder="80, 443, 8443">

      <button type="submit">Save</button>
    </form>
  </section>
{% endblock %}
