{% extends 'base.html' %}
{% block content %}
  <section class="panel">
    <div class="panel-header">
      <h2>Import Domain List</h2>
      <a class="button secondary" href="{{ url_for('domains') }}">View Domains</a>
    </div>

    <div class="import-layout">
      <div class="import-form-col">
        <div class="import-instructions">
          <p class="import-hint">Enter one domain per line. Existing domains will be skipped automatically. Port discovery runs for each new domain.</p>
        </div>
        <form id="import-form" class="import-form">
          <textarea id="domains" name="domains" rows="14" placeholder="example.com&#10;mail.example.com&#10;api.example.com"></textarea>
          <div class="import-actions">
            <button type="submit" id="import-button" class="button primary">↑ Start Import</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <div id="import-overlay" class="hidden">
    <div class="import-progress">
      <div class="import-progress-header">
        <h3>Importing domains</h3>
        <span id="import-progress-text" class="import-progress-fraction">0 / 0</span>
      </div>
      <p id="import-status-message" class="import-status-message">Preparing import...</p>
      <div class="progress-bar">
        <div id="import-progress-bar" style="width: 0%"></div>
      </div>
      <div class="import-progress-actions">
        <button type="button" id="cancel-import" class="btn-action danger">Cancel import</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('import-form');
    const overlay = document.getElementById('import-overlay');
    const importButton = document.getElementById('import-button');
    const cancelButton = document.getElementById('cancel-import');
    const statusMessage = document.getElementById('import-status-message');
    const progressBar = document.getElementById('import-progress-bar');
    const progressText = document.getElementById('import-progress-text');
    let currentToken = null;
    let polling = null;

    function setOverlay(visible) {
      overlay.classList.toggle('hidden', !visible);
      importButton.disabled = visible;
    }

    function updateProgress(state) {
      if (!state) return;
      const total = state.total || 0;
      const current = state.index || 0;
      const percent = total ? Math.min((current / total) * 100, 100) : 0;
      progressBar.style.width = `${percent}%`;
      progressText.textContent = `${current} / ${total}`;
      statusMessage.textContent = state.message || 'Working...';
      if (state.port) {
        statusMessage.textContent += ` | Port ${state.port}`;
      }
      if (state.status === 'complete' || state.status === 'cancelled' || state.status === 'error') {
        clearInterval(polling);
        polling = null;
        setTimeout(() => setOverlay(false), 800);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const domains = document.getElementById('domains').value;
      if (!domains.trim()) {
        return;
      }
      setOverlay(true);
      const response = await fetch('/import/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
        body: new URLSearchParams({ domains })
      });

      if (!response.ok) {
        setOverlay(false);
        alert('Import could not start.');
        return;
      }

      const result = await response.json();
      currentToken = result.token;
      polling = setInterval(async () => {
        const statusResponse = await fetch(`/import/${currentToken}/status`);
        const state = await statusResponse.json();
        updateProgress(state);
      }, 500);
    });

    cancelButton.addEventListener('click', async () => {
      if (!currentToken) return;
      await fetch(`/import/${currentToken}/cancel`, { method: 'POST' });
      statusMessage.textContent = 'Cancelling import...';
    });
  </script>
{% endblock %}
